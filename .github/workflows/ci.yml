name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.build/zig-cache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: scripts/setup-ci.sh
      - run: |
          scripts/test-models.sh
          scripts/test-ssh.sh
          scripts/test-clipboard-storage.sh
          python3 -m unittest discover -s Tests -p '*release*.py'
      - uses: ./.github/actions/prepare-engine
      - run: scripts/build.sh
