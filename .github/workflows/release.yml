name: Release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.build/zig-cache
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      NOTARY_PROFILE: knotch-notary
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate tag
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - run: scripts/setup-ci.sh
      - name: Check
        run: |
          scripts/test-models.sh
          scripts/test-ssh.sh
          scripts/test-clipboard-storage.sh
          python3 -m unittest discover -s Tests -p '*release*.py'
      - run: scripts/bootstrap-engine.sh --build
      - name: Configure signing
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          export SPARKLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/sparkle-private-key"
          printf 'SPARKLE_PRIVATE_KEY_FILE=%s\n' "$SPARKLE_PRIVATE_KEY_FILE" >> "$GITHUB_ENV"
          : "${DEVELOPER_ID_P12:?Missing signing certificate}"
          : "${SPARKLE_PRIVATE_KEY:?Missing update signing key}"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_PRIVATE_KEY_FILE"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          printf '::add-mask::%s\n' "$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db" > /dev/null 2>&1 || { echo "Signing credential setup failed; details suppressed."; exit 1; }
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db" > /dev/null 2>&1 || { echo "Signing credential setup failed; details suppressed."; exit 1; }
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db" > /dev/null 2>&1 || { echo "Signing credential setup failed; details suppressed."; exit 1; }
          security import "$RUNNER_TEMP/signing.p12" -k "$RUNNER_TEMP/release.keychain-db" -P "$DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null 2>&1 || { echo "Signing credential setup failed; details suppressed."; exit 1; }
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db" > /dev/null 2>&1 || { echo "Signing credential setup failed; details suppressed."; exit 1; }
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db" login.keychain-db > /dev/null 2>&1 || { echo "Signing credential setup failed; details suppressed."; exit 1; }
          security default-keychain -d user -s "$RUNNER_TEMP/release.keychain-db" > /dev/null 2>&1 || { echo "Signing credential setup failed; details suppressed."; exit 1; }
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" > /dev/null 2>&1 || { echo "Signing credential setup failed; details suppressed."; exit 1; }
      - name: Build, notarize and sign updates
        run: scripts/release.sh "${RELEASE_TAG#v}"
      - name: Publish downloads and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py "$RELEASE_TAG" ".build/release/${RELEASE_TAG#v}/artifacts"
      - name: Remove signing material
        if: always()
        run: |
          security default-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle-private-key"
