name: Knotch
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SDKROOT: macosx
    ARCHS: arm64
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    KNOTCH_UPDATES_ENABLED: NO
    SPARKLE_FEED_URL: https://raw.githubusercontent.com/Mohit-Patil/knotch/updates/appcast.xml
    SPARKLE_PUBLIC_KEY: AIi1wk9qThRWg/2emJjyCchPts/Pdfuhrh9sf+fa5jg=
    OTHER_LDFLAGS: '$(inherited) -lc++'
targets:
  Knotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
        includes:
          - '**/*.swift'
      - path: Resources/terminal.conf
        buildPhase: resources
    postBuildScripts:
      - path: scripts/copy-resources.sh
        name: Copy terminal resources and licenses
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: .build/sparkle/Sparkle.framework
        embed: true
        codeSign: true
      - framework: .build/ghostty/macos/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: IOSurface.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.personal.Knotch
        PRODUCT_NAME: Knotch
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../Frameworks'
    scheme:
      testTargets: []
