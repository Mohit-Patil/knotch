# Knotch terminal configuration — shared by all local and SSH tabs.
# Save this file, then use Settings > Reload terminal config.
# Appearance changes apply to open tabs; startup options apply to new tabs.
# Your copy is loaded after your standard Ghostty config. It does not edit it.
# Full option reference: https://ghostty.org/docs/config/reference

# Insert a newline in agent prompts, including through SSH and tmux.
# Plain Enter keeps its normal submit behavior.
keybind = shift+enter=text:\n
keybind = shift+kp_enter=text:\n

# Uncomment and customize any of these:
# theme = Catppuccin Mocha
# font-family = JetBrains Mono
# font-size = 14

# Other Ghostty engine options and config-file includes are supported.
# Options for Ghostty's own window chrome are managed by Knotch instead.
