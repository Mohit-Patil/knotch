# App-owned configuration. Never imports the user's Ghostty configuration.
font-family = Menlo
font-size = 14
background = #111315
foreground = #e4e7eb
background-opacity = 1
window-padding-x = 12
window-padding-y = 10
scrollback-limit-bytes = 16777216
image-storage-limit = 16777216
clipboard-read = deny
clipboard-write = ask
copy-on-select = false
shell-integration = detect
keybind = clear
keybind = super+c=copy_to_clipboard
keybind = super+v=paste_from_clipboard
keybind = super+a=select_all
keybind = super+equal=increase_font_size:1
keybind = super+minus=decrease_font_size:1
keybind = super+zero=reset_font_size
